<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ασκήσεις Προγραμματισμoύ στο Διαδίκτυο</title>
        <link rel="icon" type="image/x-icon" href="https://static.uowm.gr/logos/uowm-logo.png">
    </head>
    <body>
        <h1>Javascript</h1>
        <p>Μην ξεχάσεις ότι πρέπει να πατήσεις F12 για δείς τα αποτέλεσμα στο console</p>
        <script>
            // Απλή δήλωση συνάρτησης χωρίς export default
            function sayHello(name) {
                return "Hello " + name + ", how are you?";
            }

            // Καλούμε τη συνάρτηση και τυπώνουμε το αποτέλεσμα στo Console
            console.log(sayHello("Thanasis"));
        </script>
    </body>
</html>
